<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Belleza Accessoires Luxe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout concept: fashion-house editorial. Ivory canvas, cocoa bands, gold hairlines, Didone display type, square-edged luxe buttons, arched hero with live featured piece. */
:root{
  --bg:#FBF7F2; --surface:#FFFFFF; --blush:#F4E1DE; --blush-2:#F9EDEA; --beige:#EADFCF;
  --ink:#241A1D; --muted:#76686A; --gold:#B8924A; --gold-d:#8A6420; --on-gold:#241A12;
  --deep:#241A1D; --on-deep:#F6EBE3; --deep-muted:#C9B8B2; --line:#E7DBD0;
  --shadow:0 18px 44px rgba(60,35,30,.12); --ok:#2F7D5B; --err:#B3392F;
  --display:'Bodoni Moda','Amiri',Georgia,serif;
  --body:'Jost','Tajawal',system-ui,sans-serif;
  --dir:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150F11; --surface:#1F1619; --blush:#2E2025; --blush-2:#231A1E; --beige:#2B231F;
  --ink:#F5EBE4; --muted:#B7A6A6; --gold:#D6B36E; --gold-d:#C9A45C; --on-gold:#241A12;
  --deep:#0C0708; --on-deep:#F5EBE4; --deep-muted:#B7A6A6; --line:#35282C;
  --shadow:0 18px 44px rgba(0,0,0,.45); --ok:#6CC49A; --err:#F08C82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150F11; --surface:#1F1619; --blush:#2E2025; --blush-2:#231A1E; --beige:#2B231F;
  --ink:#F5EBE4; --muted:#B7A6A6; --gold:#D6B36E; --gold-d:#C9A45C; --on-gold:#241A12;
  --deep:#0C0708; --on-deep:#F5EBE4; --deep-muted:#B7A6A6; --line:#35282C;
  --shadow:0 18px 44px rgba(0,0,0,.45); --ok:#6CC49A; --err:#F08C82; color-scheme:dark}
:root[dir="rtl"]{--dir:-1;--display:'Amiri','Bodoni Moda',Georgia,serif;--body:'Tajawal','Jost',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deep)}
[dir="rtl"] *{letter-spacing:0!important}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}a{color:inherit}button{font-family:inherit}img,svg{max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.3em;color:var(--gold-d);font-weight:500;display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:30px;height:1px;background:var(--gold);flex:none}

/* announcement + header */
.ann{background:var(--deep);color:var(--on-deep);text-align:center;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;padding:9px 0;padding-top:calc(9px + env(safe-area-inset-top,0px))}
.ann b{color:var(--gold);font-weight:500}
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:80px;gap:12px}
.bar-l{display:flex;align-items:center;gap:22px}
.bar-r{display:flex;justify-content:flex-end;gap:10px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:44px;height:44px;flex:none}
.brand b{display:block;font:500 1.65rem/1 var(--display);letter-spacing:.02em}
.brand small{display:block;font-size:.6rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold-d);margin-top:5px}
.nav{display:flex;gap:24px}
.nav a{text-decoration:none;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;padding:6px 0;border-bottom:1px solid transparent;color:var(--muted);transition:color .2s,border-color .2s;white-space:nowrap}
.nav a:hover,.nav a.on{color:var(--ink);border-color:var(--gold)}
.ibtn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 12px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:.82rem;letter-spacing:.06em;transition:border-color .2s,background .2s}
.ibtn:hover{border-color:var(--gold);background:var(--surface)}
.ibtn svg{width:20px;height:20px}
.badge-n{position:absolute;top:-7px;inset-inline-end:-7px;min-width:20px;height:20px;background:var(--gold);color:var(--on-gold);font-size:.72rem;display:grid;place-items:center;padding:0 5px;font-weight:500;border-radius:10px}
.burger{display:none}
@media (max-width:1060px){
  .nav{position:absolute;inset-inline:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;gap:0;padding:6px max(18px,env(safe-area-inset-left,0px)) 14px;display:none}
  .nav.open{display:flex}
  .nav a{padding:14px 0;border-bottom:1px solid var(--line)}
  .burger{display:inline-flex}
  .brand small{display:none}
}
@media (max-width:420px){.brand b{font-size:1.35rem}.brand svg{width:36px;height:36px}}

/* buttons (square, tracked, luxe) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:1.02rem 2rem;border-radius:0;background:var(--ink);color:var(--bg);border:1px solid var(--ink);font:500 .76rem var(--body);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background .25s,color .25s,border-color .25s,transform .25s}
.btn:hover{background:var(--gold-d);border-color:var(--gold-d);color:var(--on-gold)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.gold:hover{background:transparent;color:var(--gold)}
.btn.sm{padding:.78rem 1rem;font-size:.7rem;width:100%;background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* hero */
.hero{background:radial-gradient(900px 520px at 85% 10%,var(--blush) 0,transparent 62%),linear-gradient(180deg,var(--blush-2),var(--bg));overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,5vw,70px);align-items:center;padding-block:clamp(36px,6vw,84px)}
.hero h1{margin-top:22px}
.hero h1 i{display:block;font-size:clamp(1.25rem,2.4vw,1.8rem);font-weight:400;color:var(--gold-d);margin-bottom:6px}
.hero h1 em{display:block;font-style:normal;font-weight:400;font-size:clamp(3rem,8.4vw,7rem);letter-spacing:-.01em;line-height:.98}
.hero h1 em span{font-style:italic;color:var(--gold-d)}
.hero p.sub{margin-top:24px;max-width:44ch;color:var(--muted);font-size:1.08rem;font-weight:300}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.perks{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:38px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:.84rem;max-width:520px}
.perks span{display:inline-flex;align-items:center;gap:9px}
.perks i{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);display:inline-block}
.hv{position:relative;width:100%;max-width:540px;margin-inline:auto;aspect-ratio:1/1.12}
.hv>*{position:absolute}
.h-frame{inset-inline-start:calc(13% - 16px);top:-16px;width:70%;height:92%;border:1px solid var(--gold);border-radius:999px 999px 0 0}
.h-arch{inset-inline-start:13%;top:0;width:70%;height:92%;border-radius:999px 999px 0 0;overflow:hidden;box-shadow:var(--shadow)}
.hv svg.art{width:100%;height:100%;display:block}
.h-badge{bottom:0;inset-inline-start:0;width:30%;aspect-ratio:1;border-radius:50%;box-shadow:var(--shadow);background:var(--surface)}
.h-badge svg{width:100%;height:100%;display:block}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
.h-feat{bottom:6%;inset-inline-end:0;width:50%;background:var(--surface);padding:10px;display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;box-shadow:var(--shadow);border:1px solid var(--line)}
.h-feat .ft{width:62px;height:62px;overflow:hidden}
.h-feat .ft svg{width:100%;height:100%;display:block}
.h-feat small{display:block;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d)}
.h-feat b{display:block;font:500 1rem/1.2 var(--display)}
.h-feat button{margin-top:4px;border:0;background:none;color:var(--ink);font-size:.78rem;padding:0;cursor:pointer;border-bottom:1px solid var(--gold);font-weight:500}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.hv{max-width:400px}.h-feat{grid-template-columns:48px 1fr;width:56%}.h-feat .ft{width:48px;height:48px}}

/* marquee */
.marq{background:var(--deep);color:var(--on-deep);overflow:hidden;border-block:1px solid var(--gold)}
.marq div{display:flex;width:max-content;animation:marq 38s linear infinite}
.marq span{padding:16px 26px;font:400 italic 1.35rem/1 var(--display);white-space:nowrap;display:flex;align-items:center;gap:52px}
.marq span::after{content:"";width:8px;height:8px;background:var(--gold);transform:rotate(45deg);flex:none}

/* sections */
.sec{padding-block:clamp(48px,7vw,96px)}
.head{display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:34px}
.head h2{font-size:clamp(2rem,4.6vw,3.4rem);margin-top:14px}
.head p{color:var(--muted);max-width:50ch;margin-top:10px;font-weight:300}
.link{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:3px;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase}
.cats{display:grid;grid-template-columns:1.2fr 1fr 1fr;grid-auto-rows:clamp(170px,24vw,290px);gap:14px}
.cat{position:relative;overflow:hidden;display:block;text-decoration:none;color:#fff;isolation:isolate}
.cat:first-child{grid-row:span 2}
.cat svg{width:100%;height:100%;display:block;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.cat:hover svg{transform:scale(1.06)}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(30,18,20,.62));z-index:1}
.cat span{position:absolute;z-index:2;inset-inline:18px;bottom:16px;display:flex;justify-content:space-between;align-items:end;font:400 1.55rem/1.1 var(--display);border-top:1px solid rgba(255,255,255,.55);padding-top:10px}
.cat span i{font:400 .72rem var(--body);letter-spacing:.2em;text-transform:uppercase;opacity:.9}
@media (max-width:760px){.cats{grid-template-columns:1fr 1fr}.cat:first-child{grid-column:span 2;grid-row:span 1}}

/* products */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:30px 20px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}}
.card{display:flex;flex-direction:column;animation:rise .7s both}
.thumb{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--blush);cursor:pointer;border:0;padding:0;display:block;width:100%}
.thumb svg{width:100%;height:100%;display:block;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.card:hover .thumb svg{transform:scale(1.07)}
.tag{position:absolute;top:12px;inset-inline-start:12px;background:var(--bg);color:var(--ink);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;padding:5px 10px;font-weight:500}
.tag.sale{background:var(--gold);color:var(--on-gold)}
.heart{position:absolute;top:10px;inset-inline-end:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;z-index:2;transition:transform .2s}
.heart:hover{transform:scale(1.1)}
.heart svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;transition:none!important;transform:none!important}
.heart.on svg{fill:var(--gold);stroke:var(--gold)}
.qvbtn{position:absolute;inset-inline:12px;bottom:12px;background:var(--bg);color:var(--ink);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:10px;font-weight:500;opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none}
@media (hover:hover){.card:hover .qvbtn{opacity:1;transform:none}}
.cbody{padding:14px 2px 0;display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.cbody h3{font-size:1.28rem;font-weight:500}
.cbody p{font-size:.86rem;color:var(--muted);line-height:1.5;flex:1;font-weight:300}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.price b{font-weight:500;font-size:1.02rem}
.price s{color:var(--muted);font-size:.84rem}

/* promise + offer bands */
.deep{background:var(--deep);color:var(--on-deep)}
.deep .eyebrow{color:var(--gold)}
.pro{display:grid;grid-template-columns:1fr 2fr;gap:clamp(24px,5vw,72px);align-items:start}
.pro h2{font-size:clamp(2.1rem,4.4vw,3.4rem);margin-top:14px}
.pro h2 em{font-style:italic;color:var(--gold)}
.pcols{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.pcol{border-top:1px solid var(--gold);padding-top:18px}
.pcol svg{width:34px;height:34px;color:var(--gold);margin-bottom:14px}
.pcol h3{font-size:1.4rem;margin-bottom:8px}
.pcol p{color:var(--deep-muted);font-size:.94rem;font-weight:300}
@media (max-width:900px){.pro{grid-template-columns:1fr}.pcols{grid-template-columns:1fr}}
.offer{border:1px solid var(--gold);padding:clamp(28px,6vw,70px);display:grid;grid-template-columns:1fr auto;gap:26px;align-items:center;position:relative;background:linear-gradient(120deg,var(--blush-2),var(--beige))}
.offer::before{content:"";position:absolute;inset:10px;border:1px solid var(--line);pointer-events:none}
.offer h2{font-size:clamp(1.9rem,4.2vw,3.2rem);margin:14px 0 10px;position:relative}
.offer p{color:var(--muted);max-width:50ch;position:relative;font-weight:300}
.offer .eyebrow,.offer .btn{position:relative}
@media (max-width:720px){.offer{grid-template-columns:1fr}}

/* inner pages */
.pagehead{background:var(--blush-2);padding-block:clamp(40px,7vw,86px);border-bottom:1px solid var(--line);text-align:center}
.pagehead .eyebrow{justify-content:center}
.pagehead .eyebrow::after{content:"";width:30px;height:1px;background:var(--gold)}
.pagehead h1{font-size:clamp(2.4rem,6vw,4.6rem);margin-top:16px;font-style:italic}
.pagehead p{color:var(--muted);margin:14px auto 0;max-width:56ch;font-weight:300}
.tools{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px;margin-bottom:18px}
@media (max-width:700px){.tools{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{width:100%;font:400 1rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:0;padding:13px 14px;min-width:0}
textarea{resize:vertical;min-height:110px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 16px;margin-bottom:6px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 18px;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--muted);font-size:.86rem;margin-bottom:20px}
.empty{text-align:center;padding:56px 16px;color:var(--muted);display:flex;flex-direction:column;gap:16px;align-items:center}
.empty h3{font-size:1.8rem;color:var(--ink);font-style:italic}

/* drawer */
.veil{position:fixed;inset:0;background:rgba(20,10,12,.55);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:50}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100vw);background:var(--bg);z-index:60;display:flex;flex-direction:column;transform:translateX(calc(104% * var(--dir)));visibility:hidden;transition:transform .4s cubic-bezier(.2,.7,.2,1),visibility .4s;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cart-open .veil{opacity:1;visibility:visible}
.cart-open .drawer{transform:none;visibility:visible}
.dh{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}
.dh h2{font-size:1.9rem;font-style:italic}
.dl{flex:1;overflow-y:auto;padding:6px 22px}
.line{display:grid;grid-template-columns:70px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.line .t{width:70px;height:88px;overflow:hidden}
.line .t svg{width:100%;height:100%;display:block}
.line h4{margin:0;font:500 1.12rem var(--display)}
.line small{color:var(--muted);font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);margin-top:8px}
.qty button{width:32px;height:32px;border:0;background:transparent;color:var(--ink);cursor:pointer;font-size:1.1rem}
.qty button:hover{background:var(--blush)}
.qty span{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.rm{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:.8rem;text-decoration:underline;padding:4px}
.df{padding:18px 22px 22px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.94rem}
.row.tot{color:var(--ink);font-size:1.15rem;padding-top:10px;border-top:1px solid var(--gold)}
.row.tot b{font-weight:500}

/* quick view */
.qv{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px}
.qv-back{position:absolute;inset:0;background:rgba(20,10,12,.6)}
.qv-box{position:relative;background:var(--bg);width:min(920px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;grid-template-columns:1fr 1fr;box-shadow:var(--shadow)}
.qv-art{aspect-ratio:4/5;min-height:100%;background:var(--blush);overflow:hidden}
.qv-art svg{width:100%;height:100%;display:block}
.qv-info{padding:clamp(22px,4vw,44px);display:flex;flex-direction:column;gap:14px;justify-content:center}
.qv-info h2{font-size:clamp(1.9rem,3.4vw,2.6rem)}
.qv-info p{color:var(--muted);font-weight:300}
.qvrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:6px}
.qvrow .qty{margin:0}
.qvnote{font-size:.84rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.qv-x{position:absolute;top:10px;inset-inline-end:10px;z-index:3;background:var(--bg)}
@media (max-width:700px){.qv-box{grid-template-columns:1fr}.qv-art{aspect-ratio:1;min-height:0}}

/* forms & content */
.two{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);padding:clamp(20px,3.4vw,36px)}
.panel h2{font-size:1.9rem;margin-bottom:18px;font-style:italic}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.err{color:var(--err);font-size:.82rem;min-height:1.1em}
.bad{border-color:var(--err)}
.note{margin-top:14px;padding:12px 14px;background:var(--blush-2);color:var(--muted);font-size:.9rem;border-inline-start:2px solid var(--gold)}
.note.ok{color:var(--ink);border-inline-start-color:var(--ok)}
.sum .row{padding:6px 0}
.about{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:center}

  return `<svg class="art" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">${defs}<rect width="200" height="200" fill="url(#${id}b)"/><rect width="200" height="200" fill="url(#${id}l)"/>${s}<path d="M162 34l2.4 6.6L171 43l-6.6 2.4L162 52l-2.4-6.6L153 43l6.6-2.4z" fill="#fff" opacity=".75"/><path d="M36 150l1.6 4.4L42 156l-4.4 1.6L36 162l-1.6-4.4L30 156l4.4-1.6z" fill="#fff" opacity=".6"/></svg>`;
}
function logo(){
  const id='lg'+(++uid);
  return `<svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6C77F"/><stop offset=".6" stop-color="#B8924A"/><stop offset="1" stop-color="#D9B976"/></linearGradient></defs><circle cx="24" cy="27" r="18" fill="none" stroke="url(#${id})" stroke-width="1.5"/><circle cx="24" cy="27" r="14.5" fill="none" stroke="url(#${id})" stroke-width=".6" opacity=".7"/><path d="M24 3l4.6 5.6L24 14l-4.6-5.4z" fill="url(#${id})"/><text x="24" y="36" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-size="27" font-style="italic" font-weight="600" fill="url(#${id})">B</text></svg>`;
}
const ICON={
  instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg>',
  facebook:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5H16l.5-3h-3V8.7c0-.9.3-1.5 1.6-1.5h1.5V4.5c-.3 0-1.2-.1-2.2-.1-2.3 0-3.9 1.4-3.9 4v2.1H8v3h2.5V21z"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.3 2.2 1.6 3.6 3.7 3.8v3a6.6 6.6 0 0 1-3.6-1.1v6.1a5.6 5.6 0 1 1-5.6-5.6c.3 0 .6 0 .9.1v3.1a2.6 2.6 0 1 0 1.7 2.4V3z"/></svg>'
};

/* ============ State & helpers ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
let lang=CONFIG.defaultLang,cart={},fav={},F={q:'',cat:'all',price:0,sort:'feat'};
try{fav=JSON.parse(localStorage.getItem('bz-fav')||'{}')||{};const l=localStorage.getItem('bz-lang');if(l==='ar'||l==='en')lang=l;const c=JSON.parse(localStorage.getItem('bz-cart')||'{}');if(c&&typeof c==='object')cart=c}catch(e){}
const save=()=>{try{localStorage.setItem('bz-cart',JSON.stringify(cart))}catch(e){}};
const saveFav=()=>{try{localStorage.setItem('bz-fav',JSON.stringify(fav))}catch(e){}};
const t=(k,v={})=>(STR[lang][k]??k).replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');
const fmt=n=>n.toLocaleString('en-US')+' '+t('cur');
const pname=p=>lang==='ar'?p.ar:p.en,pdesc=p=>lang==='ar'?p.dar:p.den;
const byId=id=>PRODUCTS.find(p=>p.id===+id);
const lines=()=>Object.entries(cart).map(([id,q])=>({p:byId(id),q})).filter(l=>l.p&&l.q>0);
const subtotal=()=>lines().reduce((s,l)=>s+l.p.p*l.q,0);
const delivery=s=>s===0||s>=CONFIG.freeOver?0:CONFIG.deliveryFee;
const CATS=[['all','c_all'],['accessories','c_acc'],['bags','c_bag'],['jewelry','c_jew'],['watches','c_wat'],['beauty','c_bea'],['new','c_new'],['best','c_best'],['fav','c_fav']];
const TILE={jewelry:['necklace',PAL.blush,'gold'],bags:['bag',PAL.cream,'gold'],watches:['watch',PAL.beige,'gold'],accessories:['hairclip',PAL.mauve,'gold'],beauty:['perfume',PAL.sand,'gold']};

/* ============ Rendering ============ */
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5S4 15.2 4 9.6A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 8 2.2c0 5.6-8 10.9-8 10.9z"/></svg>';
function card(p,i=0){
  const disc=p.old?Math.round((1-p.p/p.old)*100):0;
  const tag=disc?`<span class="tag sale">-${disc}%</span>`:p.new?`<span class="tag">${t('b_new')}</span>`:p.best?`<span class="tag">${t('b_best')}</span>`:'';
  return `<article class="card" style="animation-delay:${Math.min(i,8)*0.06}s"><div style="position:relative"><button class="thumb" type="button" data-qv="${p.id}" aria-label="${t('view')}: ${pname(p)}">${art(p.type,p.c)}${tag}<span class="qvbtn">${t('view')}</span></button><button class="heart${fav[p.id]?' on':''}" type="button" data-fav="${p.id}" aria-label="${t('fav_t')}" aria-pressed="${!!fav[p.id]}">${HEART}</button></div><div class="cbody"><h3>${pname(p)}</h3><p>${pdesc(p)}</p><div class="price"><b>${fmt(p.p)}</b>${p.old?`<s>${fmt(p.old)}</s>`:''}</div><button class="btn sm" type="button" data-add="${p.id}">${t('add')}</button></div></article>`;
}
function hero(){
  const f=byId(2),gid='bp'+(++uid);
  return `<div class="h-frame"></div><div class="h-arch">${art('necklace',{bg:PAL.blush,metal:'gold',a:'#EBB9C4'})}</div>
  <div class="h-badge"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><path id="${gid}" d="M60 60m-43 0a43 43 0 1 1 86 0a43 43 0 1 1 -86 0"/></defs><circle cx="60" cy="60" r="58" style="fill:var(--surface)"/><g class="spin"><text font-size="10.5" textLength="262" lengthAdjust="spacing" style="fill:var(--gold-d)" font-family="Jost,sans-serif"><textPath href="#${gid}">BELLEZA ACCESSOIRES • BELLEZA •</textPath></text></g><path d="M60 47l8 13-8 13-8-13z" style="fill:var(--gold)"/></svg></div>
  <div class="h-feat"><div class="ft">${art(f.type,f.c)}</div><div><small>${t('hero_feat')}</small><b>${pname(f)}</b><div style="font-size:.85rem;color:var(--muted)">${fmt(f.p)}</div><button type="button" data-add="${f.id}">${t('add')}</button></div></div>`;
}
function renderHome(){
  $('#gridNew').innerHTML=PRODUCTS.filter(p=>p.new).slice(0,4).map(card).join('');
  $('#gridBest').innerHTML=PRODUCTS.filter(p=>p.best).slice(0,4).map(card).join('');
  $('#cats').innerHTML=Object.keys(TILE).map(k=>{const [ty,bg,me]=TILE[k];const lab=t(CATS.find(c=>c[0]===k)[1]);return `<a class="cat" href="#shop" data-go="${k}">${art(ty,{bg,metal:me,a:'#EBB9C4'})}<span>${lab}<i>${t('see_all')}</i></span></a>`}).join('');
  $('#offerT').textContent=t('offer_t',{free:fmt(CONFIG.freeOver)});
  $('#annT').innerHTML=t('ann',{free:'<b>'+fmt(CONFIG.freeOver)+'</b>'});
  $('#p3d').textContent=t('p3d',{days:CONFIG.exchangeDays});
  const words=['c_jew','c_bag','c_wat','c_acc','c_bea'].map(k=>`<span>${t(k)}</span>`).join('');
  $('#marq').innerHTML=words+words+words+words;
  $('#collage').innerHTML=hero();$('#aboutArt').innerHTML=hero();
}
function filtered(){
  const q=F.q.trim().toLowerCase(),rng=[[0,1e9],[0,3000],[3000,6000],[6000,10000],[10000,1e9]][F.price];
  let r=PRODUCTS.filter(p=>{
    if(F.cat==='new'&&!p.new)return false;
    if(F.cat==='best'&&!p.best)return false;
    if(F.cat==='fav'&&!fav[p.id])return false;
    if(!['all','new','best','fav'].includes(F.cat)&&p.cat!==F.cat)return false;
    if(p.p<rng[0]||p.p>=rng[1])return false;
    if(q&&!(p.en+' '+p.ar+' '+p.den+' '+p.dar).toLowerCase().includes(q))return false;
    return true});
  if(F.sort==='low')r.sort((a,b)=>a.p-b.p);else if(F.sort==='high')r.sort((a,b)=>b.p-a.p);
  return r;
}
function renderShop(){
  $('#chips').innerHTML=CATS.map(([k,l])=>`<button type="button" class="chip${F.cat===k?' on':''}" data-cat="${k}" aria-pressed="${F.cat===k}">${t(l)}</button>`).join('');
  const r=filtered();
  $('#gridShop').innerHTML=r.map(card).join('');
  $('#resCount').textContent=t('results',{n:r.length});
  $('#shopEmpty').hidden=r.length>0;
}
function renderCart(){
  const L=lines(),n=L.reduce((s,l)=>s+l.q,0),s=subtotal(),d=delivery(s);
  $('#cartCount').textContent=n;$('#cartCount').hidden=n===0;
  if(!L.length){
    $('#dl').innerHTML=`<div class="empty"><h3>${t('cart_empty')}</h3></div>`;
    $('#df').innerHTML=`<a class="btn" href="#shop" data-close>${t('cont')}</a>`;
  }else{
    $('#dl').innerHTML=L.map(({p,q})=>`<div class="line"><div class="t">${art(p.type,p.c)}</div><div><h4>${pname(p)}</h4><small>${fmt(p.p)}</small><div class="qty"><button type="button" data-q="${p.id}:-1" aria-label="-">−</button><span>${q}</span><button type="button" data-q="${p.id}:1" aria-label="+">+</button></div></div><div style="text-align:end"><b style="font-weight:500;font-variant-numeric:tabular-nums">${fmt(p.p*q)}</b><br><button class="rm" type="button" data-q="${p.id}:x">${t('remove')}</button></div></div>`).join('');
    $('#df').innerHTML=`<div class="row"><span>${t('subtotal')}</span><span>${fmt(s)}</span></div><div class="row"><span>${t('delivery')}</span><span>${d?fmt(d):t('free')}</span></div><div class="row tot"><span>${t('total')}</span><b>${fmt(s+d)}</b></div><a class="btn" href="#checkout" data-close>${t('checkout_btn')}</a>`;
  }
  renderSummary();
}
function renderSummary(){
  const L=lines(),s=subtotal(),d=delivery(s);
  $('#coSum').innerHTML=L.length?L.map(({p,q})=>`<div class="row"><span>${pname(p)} × ${q}</span><span>${fmt(p.p*q)}</span></div>`).join('')+`<div class="row"><span>${t('subtotal')}</span><span>${fmt(s)}</span></div><div class="row"><span>${t('delivery')}</span><span>${d?fmt(d):t('free')}</span></div><div class="row tot"><span>${t('total')}</span><b>${fmt(s+d)}</b></div>`:`<div class="empty"><h3>${t('cart_empty')}</h3><a class="btn ghost" href="#shop">${t('cont')}</a></div>`;
}
function renderStatic(){
  $$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  $$('[data-i18n-html]').forEach(e=>e.innerHTML=t(e.dataset.i18nHtml));
  $$('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  $$('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.i18nAria)));
  $('#langBtn').textContent=t('lang_btn');
  const w=$('#fWilaya'),cur=w.value;
  w.innerHTML=`<option value="">${t('wilaya_ph')}</option>`+WIL[lang].map((n,i)=>`<option value="${i+1}">${String(i+1).padStart(2,'0')} · ${n}</option>`).join('');
  w.value=cur;
  $('#polD').innerHTML=['d1','d2','d3','d4'].map(k=>`<li>${t(k,{fee:fmt(CONFIG.deliveryFee),free:fmt(CONFIG.freeOver)})}</li>`).join('');
  $('#polX').innerHTML=['x1','x2','x3','x4'].map(k=>`<li>${t(k,{days:CONFIG.exchangeDays})}</li>`).join('');
  const soc=['instagram','facebook','tiktok'].map(k=>`<a href="${CONFIG[k]}" target="_blank" rel="noopener noreferrer" aria-label="${k}">${ICON[k]}</a>`).join('');
  $('#socFoot').innerHTML=soc;$('#socContact').innerHTML=soc;
  $('#waShow').textContent=CONFIG.whatsappShow;$('#mailShow').textContent=CONFIG.email;
}
function renderAll(){renderStatic();renderHome();renderShop();renderCart()}
function setLang(l){
  lang=l;try{localStorage.setItem('bz-lang',l)}catch(e){}
  document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
  renderAll();if(!$('#qv').hidden)renderQV();
}

/* ============ Cart actions ============ */
let toastT;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1800)}
function add(id){cart[id]=(cart[id]||0)+1;save();renderCart();toast(t('added'))}
function setQty(id,op){
  if(op==='x')delete cart[id];else{cart[id]=(cart[id]||0)+ +op;if(cart[id]<=0)delete cart[id]}
  save();renderCart();
}
let qvId=0,qvQty=1;
function renderQV(){
  const p=byId(qvId);if(!p)return;
  const disc=p.old?Math.round((1-p.p/p.old)*100):0;
  $('#qvBody').innerHTML=`<div class="qv-art">${art(p.type,p.c)}</div><div class="qv-info"><div class="eyebrow">${t(CATS.find(c=>c[0]===p.cat)[1])}</div><h2>${pname(p)}</h2><div class="price" style="margin:0"><b style="font-size:1.3rem">${fmt(p.p)}</b>${p.old?`<s>${fmt(p.old)}</s> <span class="tag sale" style="position:static">-${disc}%</span>`:''}</div><p>${pdesc(p)}</p><div class="qvrow"><div class="qty"><button type="button" data-qvq="-1" aria-label="-">−</button><span>${qvQty}</span><button type="button" data-qvq="1" aria-label="+">+</button></div><button class="btn" type="button" data-qvadd style="flex:1;min-width:170px">${t('add')}</button></div><div class="qvnote">${t('d2',{fee:fmt(CONFIG.deliveryFee),free:fmt(CONFIG.freeOver)})}</div></div>`;
}
function openQV(id){qvId=+id;qvQty=1;renderQV();$('#qv').hidden=false;document.body.style.overflow='hidden';$('#qvClose').focus()}
function closeQV(){const q=$('#qv');if(!q||q.hidden)return;q.hidden=true;document.body.style.overflow=''}
function openCart(o){document.body.classList.toggle('cart-open',o);$('#drawer').setAttribute('aria-hidden',String(!o));if(o)$('#closeCart').focus()}

/* ============ Routing ============ */
const PAGES=['home','shop','about','contact','delivery','checkout'];
let lastPage='';
function route(){
  let h=location.hash.slice(1);if(!PAGES.includes(h))h='home';
  $$('[data-page]').forEach(s=>s.hidden=s.dataset.page!==h);
  $$('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===h));
  $('#nav').classList.remove('open');openCart(false);closeQV();
  if(h==='checkout')renderSummary();
  if(h!==lastPage){window.scrollTo(0,0);lastPage=h}
}

/* ============ WhatsApp ============ */
const waUrl=txt=>`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(txt)}`;
function setErr(id,msg){const e=$(`[data-err="${id}"]`),i=$('#'+id);if(e)e.textContent=msg||'';if(i)i.classList.toggle('bad',!!msg)}
function validOrder(){
  const name=$('#fName').value.trim(),phone=$('#fPhone').value.replace(/[\s.\-()]/g,''),w=$('#fWilaya').value,addr=$('#fAddr').value.trim();
  let ok=true;
  const chk=(id,bad,msg)=>{setErr(id,bad?msg:'');if(bad)ok=false};
  chk('fName',name.length<2,t('err_req'));
  chk('fPhone',!/^(?:\+?213|0)[567]\d{8}$/.test(phone),t('err_phone'));
  chk('fWilaya',!w,t('err_req'));
  chk('fAddr',addr.length<4,t('err_req'));
  $('#cartErr').textContent=lines().length?'':t('err_cart');
  if(!lines().length)ok=false;
  return ok?{name,phone:$('#fPhone').value.trim(),wilaya:WIL[lang][+w-1],addr,note:$('#fNote').value.trim()}:null;
}
function buildOrder(o){
  const s=subtotal(),d=delivery(s);
  const items=lines().map(({p,q})=>`- ${pname(p)} × ${q} = ${fmt(p.p*q)}`).join('\n');
  return [`*${t('wa_head')}*`,'',`${t('wa_name')}: ${o.name}`,`${t('wa_phone')}: ${o.phone}`,`${t('wa_wilaya')}: ${o.wilaya}`,`${t('wa_addr')}: ${o.addr}`,'',`${t('wa_items')}:`,items,'',`${t('wa_sub')}: ${fmt(s)}`,`${t('wa_del')}: ${d?fmt(d):t('free')}`,`*${t('wa_total')}: ${fmt(s+d)}*`,o.note?`\n${t('wa_note')}: ${o.note}`:''].join('\n');
}

/* ============ Events ============ */
document.addEventListener('click',e=>{
  const T=e.target.closest.bind(e.target);
  let b;
  if(b=T('[data-add]'))return add(b.dataset.add);
  if(b=T('[data-fav]')){const id=b.dataset.fav;if(fav[id])delete fav[id];else fav[id]=1;saveFav();$$('[data-fav="'+id+'"]').forEach(x=>{x.classList.toggle('on',!!fav[id]);x.setAttribute('aria-pressed',String(!!fav[id]))});if(F.cat==='fav')renderShop();return}
  if(b=T('[data-qv]'))return openQV(b.dataset.qv);
  if(T('[data-qvclose]'))return closeQV();
  if(b=T('[data-qvq]')){qvQty=Math.max(1,qvQty+ +b.dataset.qvq);return renderQV()}
  if(T('[data-qvadd]')){cart[qvId]=(cart[qvId]||0)+qvQty;save();renderCart();toast(t('added'));return closeQV()}
  if(b=T('[data-q]')){const [id,op]=b.dataset.q.split(':');return setQty(id,op)}
  if(b=T('[data-cat]')){F.cat=b.dataset.cat;return renderShop()}
  if(b=T('[data-go]')){F.cat=b.dataset.go;F.q='';F.price=0;$('#q').value='';$('#price').value='0';renderShop();return}
  if(T('[data-close]'))openCart(false);
});
$('#cartBtn').onclick=()=>openCart(true);
$('#closeCart').onclick=()=>openCart(false);
$('#veil').onclick=()=>openCart(false);
$('#burger').onclick=()=>$('#nav').classList.toggle('open');
$('#langBtn').onclick=()=>setLang(lang==='ar'?'en':'ar');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){openCart(false);closeQV()}});
$('#q').oninput=e=>{F.q=e.target.value;renderShop()};
$('#price').onchange=e=>{F.price=+e.target.value;renderShop()};
$('#sort').onchange=e=>{F.sort=e.target.value;renderShop()};
$('#clearF').onclick=()=>{F={q:'',cat:'all',price:0,sort:'feat'};$('#q').value='';$('#price').value='0';$('#sort').value='feat';renderShop()};
$('#coForm').addEventListener('submit',e=>e.preventDefault());
$('#ctForm').addEventListener('submit',e=>e.preventDefault());
$('#waBtn').addEventListener('click',e=>{
  const o=validOrder();
  if(!o){e.preventDefault();const bad=$('#coForm .bad');if(bad)bad.focus();return}
  $('#waBtn').href=waUrl(buildOrder(o));
  $('#sentNote').hidden=false;
});
$('#clearCart').onclick=()=>{cart={};save();renderCart();$('#sentNote').hidden=true;location.hash='#shop'};
$('#ctBtn').addEventListener('click',e=>{
  const n=$('#cName').value.trim(),m=$('#cMsg').value.trim();
  setErr('cName',n.length<2?t('err_req'):'');setErr('cMsg',m.length<2?t('err_req'):'');
  if(n.length<2||m.length<2){e.preventDefault();return}
  $('#ctBtn').href=waUrl(`*${t('wa_ct')}*\n\n${t('wa_name')}: ${n}\n\n${m}`);
});
['fName','fPhone','fWilaya','fAddr'].forEach(id=>$('#'+id).addEventListener('input',()=>setErr(id,'')));
window.addEventListener('hashchange',route);

/* ============ Init ============ */
$('#logo1').innerHTML=logo();$('#logo2').innerHTML=logo();
$('#yr').textContent=new Date().getFullYear();
document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
renderAll();route();
</script>

</html>
